
# Example nginx configuration for TCP and TLS RTT measurement
# with proxy_protocol v2 support

worker_processes auto;

events {
    worker_connections 1024;
}

# Stream module example - TCP RTT measurement
stream {
    # Server that receives connections and forwards them with proxy_protocol v2
    server {
        listen 8000 proxy_protocol;
        
        # Use the tcp_rtt variable
        log_format rtt '$remote_addr - tcp_rtt=$tcp_rtt';
        access_log /var/log/nginx/stream_access.log rtt;
        
        proxy_pass backend_server;
        proxy_protocol on;  # Send proxy_protocol v2 with TCP RTT TLV
    }
    
    upstream backend_server {
        server 127.0.0.1:9000;
    }
    
    # Backend server that receives proxy_protocol
    server {
        listen 9000;
        return "OK\n";
    }
}

# HTTP module example - TLS RTT measurement  
http {
    log_format rtt_log '$remote_addr - tcp_rtt=$tcp_rtt tls_rtt=$tls_handshake_rtt '
                       'status=$status';
    
    # Server that terminates TLS and measures RTT
    server {
        listen 443 ssl proxy_protocol;
        server_name example.com;
        
        ssl_certificate /path/to/cert.pem;
        ssl_certificate_key /path/to/key.pem;
        
        access_log /var/log/nginx/http_access.log rtt_log;
        
        location / {
            # TCP RTT is available from proxy_protocol or direct measurement
            add_header X-TCP-RTT $tcp_rtt always;
            
            # TLS RTT is available after SSL handshake
            add_header X-TLS-RTT $tls_handshake_rtt always;
            
            proxy_pass http://backend;
            proxy_set_header Host $host;
            
            # Forward proxy_protocol v2 with RTT information
            proxy_protocol on;
        }
    }
    
    # Backend HTTP server
    upstream backend {
        server 127.0.0.1:8080;
    }
    
    server {
        listen 8080;
        
        location / {
            return 200 "Backend response\n";
        }
    }
}
